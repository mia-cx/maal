name: CI

on:
  pull_request:
  push:
    branches: [rewrite/local-first-v1, main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate clean foundation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm validate
      - run: pnpm test:d1-schema
